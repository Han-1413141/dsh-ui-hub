name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Syntax check bundle
        run: node --check lib/client.js && node --check lib/index.js
      - name: Run verification suite
        run: python test/verify.py
      - name: Verify current Web and Desktop contracts
        run: python test/verify_compat.py
      - name: Verify stable layout identities and undo
        run: python test/verify_layout.py
